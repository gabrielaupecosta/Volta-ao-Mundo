<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Volta ao Mundo - O Desafio dos 196 Países</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Fonte Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#1e3a8a',
            }
          }
        }
      }
    }
  </script>

  <style>
    /* Estilização da barra de rolagem */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
    
    @keyframes pulse-success {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    .animate-success-pop {
      animation: pulse-success 0.3s ease-in-out;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans selection:bg-brand-500 selection:text-white">

  <!-- HEADER -->
  <header class="border-b border-slate-800 bg-slate-900/90 backdrop-blur sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5 flex flex-wrap items-center justify-between gap-4">
      
      <!-- LOGO -->
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-indigo-500 flex items-center justify-center shadow-lg shadow-brand-500/20">
          <i data-lucide="globe-2" class="w-6 h-6 text-white"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
            Volta ao Mundo
            <span class="text-xs px-2 py-0.5 rounded-full bg-brand-500/20 text-brand-400 font-semibold border border-brand-500/30">196 Países</span>
          </h1>
          <p class="text-xs text-slate-400 hidden sm:block">Adivinhe todas as nações do planeta antes do tempo acabar</p>
        </div>
      </div>

      <!-- PAINEL CONTROLES -->
      <div class="flex items-center gap-3">
        <!-- ÁUDIO -->
        <button id="toggleAudioBtn" class="p-2 text-slate-400 hover:text-white rounded-lg hover:bg-slate-800 transition" title="Alternar som">
          <i id="audioIcon" data-lucide="volume-2" class="w-5 h-5"></i>
        </button>

        <!-- MODO DE TEMPO -->
        <div class="flex bg-slate-800 p-0.5 rounded-lg border border-slate-700 text-xs">
          <button id="modeTimerBtn" class="px-2.5 py-1.5 rounded-md font-semibold text-white bg-brand-600 transition">15 min</button>
          <button id="modeFreeBtn" class="px-2.5 py-1.5 rounded-md font-semibold text-slate-400 hover:text-white transition">Livre</button>
        </div>

        <!-- BOTÃO AÇÃO (INICIAR / DESISTIR) -->
        <button id="gameActionBtn" class="px-4 py-2 rounded-lg font-bold text-sm bg-emerald-600 hover:bg-emerald-500 text-white shadow-md hover:shadow-emerald-500/20 transition flex items-center gap-1.5">
          <i data-lucide="play" class="w-4 h-4 fill-white"></i>
          <span>Começar</span>
        </button>
      </div>

    </div>
  </header>

  <!-- CONTEÚDO PRINCIPAL -->
  <main class="flex-1 max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-6 flex flex-col gap-6">

    <!-- BARRA DE STATUS / PAINEL SUPERIOR -->
    <section class="grid grid-cols-2 md:grid-cols-4 gap-3">
      <!-- CARD 1: PLACAR -->
      <div class="bg-slate-800/80 border border-slate-700/80 p-4 rounded-xl flex items-center justify-between">
        <div>
          <span class="text-xs font-semibold text-slate-400 block uppercase tracking-wider">Acertos</span>
          <div class="text-2xl font-extrabold text-white mt-0.5">
            <span id="scoreDisplay" class="text-brand-400">0</span>
            <span class="text-slate-500 text-lg">/ 196</span>
          </div>
        </div>
        <div class="w-10 h-10 rounded-lg bg-brand-500/10 border border-brand-500/20 flex items-center justify-center text-brand-400">
          <i data-lucide="check-circle-2" class="w-5 h-5"></i>
        </div>
      </div>

      <!-- CARD 2: PROGRESSO % -->
      <div class="bg-slate-800/80 border border-slate-700/80 p-4 rounded-xl flex items-center justify-between">
        <div>
          <span class="text-xs font-semibold text-slate-400 block uppercase tracking-wider">Conclusão</span>
          <div class="text-2xl font-extrabold text-white mt-0.5" id="percentDisplay">0%</div>
        </div>
        <div class="w-10 h-10 rounded-lg bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-400">
          <i data-lucide="pie-chart" class="w-5 h-5"></i>
        </div>
      </div>

      <!-- CARD 3: TEMPO -->
      <div class="bg-slate-800/80 border border-slate-700/80 p-4 rounded-xl flex items-center justify-between">
        <div>
          <span class="text-xs font-semibold text-slate-400 block uppercase tracking-wider" id="timerLabel">Tempo</span>
          <div class="text-2xl font-mono font-bold text-white mt-0.5 tracking-tight" id="timerDisplay">15:00</div>
        </div>
        <div class="w-10 h-10 rounded-lg bg-amber-500/10 border border-amber-500/20 flex items-center justify-center text-amber-400">
          <i data-lucide="clock" class="w-5 h-5"></i>
        </div>
      </div>

      <!-- CARD 4: ÚLTIMO ACERTO -->
      <div class="bg-slate-800/80 border border-slate-700/80 p-4 rounded-xl flex items-center justify-between overflow-hidden">
        <div class="truncate">
          <span class="text-xs font-semibold text-slate-400 block uppercase tracking-wider">Último Acerto</span>
          <div class="text-lg font-bold text-emerald-400 mt-1 truncate" id="lastGuessedDisplay">—</div>
        </div>
        <div class="w-10 h-10 rounded-lg bg-indigo-500/10 border border-indigo-500/20 flex items-center justify-center text-indigo-400 shrink-0">
          <i data-lucide="compass" class="w-5 h-5"></i>
        </div>
      </div>
    </section>

    <!-- BARRA DE PROGRESSO GLOBAL -->
    <div class="w-full bg-slate-800 rounded-full h-2.5 overflow-hidden border border-slate-700/50">
      <div id="progressBar" class="bg-gradient-to-r from-brand-600 to-emerald-400 h-2.5 rounded-full transition-all duration-300 w-0"></div>
    </div>

    <!-- CAMPO DE DIGITAÇÃO -->
    <div class="relative">
      <div class="relative flex items-center">
        <i data-lucide="search" class="w-6 h-6 text-slate-400 absolute left-4 pointer-events-none"></i>
        <input 
          id="countryInput"
          type="text" 
          disabled
          autocomplete="off" 
          autocorrect="off" 
          spellcheck="false"
          placeholder="Clique em 'Começar' para iniciar sua jornada..." 
          class="w-full pl-13 pr-28 py-4 bg-slate-800/90 border-2 border-slate-700 focus:border-brand-500 rounded-2xl text-lg font-medium placeholder-slate-500 text-white outline-none transition disabled:opacity-50 disabled:cursor-not-allowed shadow-inner"
        >
        <span id="typingFeedback" class="absolute right-4 text-xs font-bold px-2 py-1 rounded bg-slate-700/50 text-slate-400">
          Aguardando
        </span>
      </div>
    </div>

    <!-- ABAS DOS CONTINENTES -->
    <div class="flex items-center gap-2 overflow-x-auto pb-1 border-b border-slate-800" id="continentTabs">
      <button class="continent-tab px-3.5 py-2 rounded-lg text-sm font-semibold whitespace-nowrap bg-brand-600 text-white transition flex items-center gap-2" data-continent="all">
        Todos <span class="text-xs bg-slate-900/40 px-1.5 py-0.5 rounded-full" id="count-all">0/196</span>
      </button>
      <button class="continent-tab px-3.5 py-2 rounded-lg text-sm font-semibold whitespace-nowrap bg-slate-800 text-slate-300 hover:text-white transition flex items-center gap-2" data-continent="Americas">
        Américas <span class="text-xs bg-slate-900/40 px-1.5 py-0.5 rounded-full" id="count-americas">0/35</span>
      </button>
      <button class="continent-tab px-3.5 py-2 rounded-lg text-sm font-semibold whitespace-nowrap bg-slate-800 text-slate-300 hover:text-white transition flex items-center gap-2" data-continent="Europa">
        Europa <span class="text-xs bg-slate-900/40 px-1.5 py-0.5 rounded-full" id="count-europa">0/44</span>
      </button>
      <button class="continent-tab px-3.5 py-2 rounded-lg text-sm font-semibold whitespace-nowrap bg-slate-800 text-slate-300 hover:text-white transition flex items-center gap-2" data-continent="Asia">
        Ásia <span class="text-xs bg-slate-900/40 px-1.5 py-0.5 rounded-full" id="count-asia">0/48</span>
      </button>
      <button class="continent-tab px-3.5 py-2 rounded-lg text-sm font-semibold whitespace-nowrap bg-slate-800 text-slate-300 hover:text-white transition flex items-center gap-2" data-continent="Africa">
        África <span class="text-xs bg-slate-900/40 px-1.5 py-0.5 rounded-full" id="count-africa">0/54</span>
      </button>
      <button class="continent-tab px-3.5 py-2 rounded-lg text-sm font-semibold whitespace-nowrap bg-slate-800 text-slate-300 hover:text-white transition flex items-center gap-2" data-continent="Oceania">
        Oceania <span class="text-xs bg-slate-900/40 px-1.5 py-0.5 rounded-full" id="count-oceania">0/14</span>
      </button>
    </div>

    <!-- GRADE DOS PAÍSES -->
    <div id="countriesGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-2.5 pb-12">
      <!-- Inserido dinamicamente via JS -->
    </div>

  </main>

  <!-- MODAL DE FIM DE JOGO -->
  <div id="gameOverModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-900 border border-slate-700 max-w-md w-full rounded-2xl p-6 shadow-2xl text-center flex flex-col items-center">
      <div id="modalIconContainer" class="w-16 h-16 rounded-2xl bg-brand-500/20 text-brand-400 border border-brand-500/30 flex items-center justify-center mb-4">
        <i data-lucide="trophy" class="w-8 h-8"></i>
      </div>
      <h3 id="modalTitle" class="text-2xl font-black text-white">Fim da Viagem!</h3>
      <p id="modalSubtitle" class="text-slate-400 text-sm mt-1 mb-6">Confira o seu desempenho na Volta ao Mundo:</p>

      <div class="w-full bg-slate-800/80 border border-slate-700 rounded-xl p-4 grid grid-cols-2 gap-4 mb-6">
        <div>
          <span class="text-xs text-slate-400 uppercase font-semibold">Total Acertado</span>
          <div class="text-2xl font-bold text-white mt-0.5"><span id="modalScore">0</span> / 196</div>
        </div>
        <div>
          <span class="text-xs text-slate-400 uppercase font-semibold">Aproveitamento</span>
          <div class="text-2xl font-bold text-brand-400 mt-0.5" id="modalPercent">0%</div>
        </div>
      </div>

      <div class="flex gap-3 w-full">
        <button id="modalReviewBtn" class="flex-1 py-2.5 rounded-xl font-semibold bg-slate-800 hover:bg-slate-700 text-slate-300 transition text-sm">
          Ver Respostas
        </button>
        <button id="modalRestartBtn" class="flex-1 py-2.5 rounded-xl font-semibold bg-brand-600 hover:bg-brand-500 text-white transition text-sm">
          Jogar Novamente
        </button>
      </div>
    </div>
  </div>

      // OCEANIA (14)

      { name: "Nauru", continent: "Oceania", syn: ["nauru"] },
      { name: "Nova Zelândia", continent: "Oceania", syn: ["nova zelandia", "new zealand"] },
      { name: "Palau", continent: "Oceania", syn: ["palau"] },
      { name: "Papua Nova Guiné", continent: "Oceania", syn: ["papua nova guine", "papua"] },
      { name: "Samoa", continent: "Oceania", syn: ["samoa"] },
      { name: "Tonga", continent: "Oceania", syn: ["tonga"] },
      { name: "Tuvalu", continent: "Oceania", syn: ["tuvalu"] },
      { name: "Vanuatu", continent: "Oceania", syn: ["vanuatu"] }
    ];

    // ESTADO DO JOGO
    let isPlaying = false;
    let mode = 'timer'; // 'timer' ou 'free'
    let timeRemaining = 15 * 60; // 15 minutos em segundos
    let timerInterval = null;
    let guessedCountries = new Set();
    let isMuted = false;
    let activeFilter = 'all';

    // ELEMENTOS DOM
    const gameActionBtn = document.getElementById('gameActionBtn');
    const countryInput = document.getElementById('countryInput');
    const typingFeedback = document.getElementById('typingFeedback');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const percentDisplay = document.getElementById('percentDisplay');
    const timerDisplay = document.getElementById('timerDisplay');
    const timerLabel = document.getElementById('timerLabel');
    const progressBar = document.getElementById('progressBar');
    const lastGuessedDisplay = document.getElementById('lastGuessedDisplay');
    const countriesGrid = document.getElementById('countriesGrid');
    const modeTimerBtn = document.getElementById('modeTimerBtn');
    const modeFreeBtn = document.getElementById('modeFreeBtn');
    const toggleAudioBtn = document.getElementById('toggleAudioBtn');
    const audioIcon = document.getElementById('audioIcon');
    const continentTabs = document.querySelectorAll('.continent-tab');
    
    // MODAL DOM
    const gameOverModal = document.getElementById('gameOverModal');
    const modalTitle = document.getElementById('modalTitle');
    const modalSubtitle = document.getElementById('modalSubtitle');
    const modalScore = document.getElementById('modalScore');
    const modalPercent = document.getElementById('modalPercent');
    const modalReviewBtn = document.getElementById('modalReviewBtn');
    const modalRestartBtn = document.getElementById('modalRestartBtn');

    // WEB AUDIO API
    let audioCtx = null;
    function playSound(type) {
      if (isMuted) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'hit') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
          osc.frequency.exponentialRampToValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
          gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.2);
        } else if (type === 'duplicate') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(220, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.15);
        }
      } catch (e) {
        console.error("Audio error", e);
      }
    }

    // UTILITÁRIO DE NORMALIZAÇÃO
    function normalize(text) {
      return text
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9]/g, "")
        .trim();
    }

    // INICIALIZAÇÃO DA GRADE
    function renderGrid() {
      countriesGrid.innerHTML = '';
      COUNTRIES_DB.sort((a, b) => a.name.localeCompare(b.name)).forEach((country, index) => {
        const card = document.createElement('div');
        card.id = `card-${index}`;
        card.dataset.continent = country.continent;
        card.dataset.index = index;
        card.className = `p-3 rounded-xl border border-slate-800 bg-slate-800/40 text-center flex flex-col items-center justify-center min-h-[58px] transition-all duration-300`;
        
        card.innerHTML = `
          <span class="country-name text-xs font-semibold text-slate-500 uppercase tracking-wider select-none">• • •</span>
          <span class="text-[10px] text-slate-500 font-medium uppercase mt-0.5">${country.continent}</span>
        `;
        countriesGrid.appendChild(card);
      });
      updateCounters();
    }

    // ATUALIZAÇÃO DE CONTADORES E TABS
    function updateCounters() {
      const counts = { all: 0, Americas: 0, Europa: 0, Asia: 0, Africa: 0, Oceania: 0 };
      guessedCountries.forEach(idx => {
        const c = COUNTRIES_DB[idx];
        counts.all++;
        counts[c.continent]++;
      });

      document.getElementById('count-all').innerText = `${counts.all}/196`;
      document.getElementById('count-americas').innerText = `${counts.Americas}/35`;
      document.getElementById('count-europa').innerText = `${counts.Europa}/44`;
      document.getElementById('count-asia').innerText = `${counts.Asia}/48`;
      document.getElementById('count-africa').innerText = `${counts.Africa}/54`;
      document.getElementById('count-oceania').innerText = `${counts.Oceania}/14`;

      scoreDisplay.innerText = counts.all;
      const pct = Math.round((counts.all / 196) * 100);
      percentDisplay.innerText = `${pct}%`;
      progressBar.style.width = `${pct}%`;
    }

    // FORMATAÇÃO DE TEMPO
    function formatTime(seconds) {
      const m = Math.floor(seconds / 60);
      const s = seconds % 60;
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    // INICIAR JOGO
    function startGame() {
      isPlaying = true;
      guessedCountries.clear();
      renderGrid();
      
      // Reset de controles
      countryInput.disabled = false;
      countryInput.value = '';
      countryInput.placeholder = 'Digite um país (ex: Brasil, Japão, Egito)...';
      countryInput.focus();
      typingFeedback.innerText = 'Digite';
      typingFeedback.className = 'absolute right-4 text-xs font-bold px-2 py-1 rounded bg-slate-700/50 text-slate-400';

      gameActionBtn.innerHTML = `<i data-lucide="flag" class="w-4 h-4 fill-white"></i> <span>Desistir</span>`;
      gameActionBtn.className = "px-4 py-2 rounded-lg font-bold text-sm bg-rose-600 hover:bg-rose-500 text-white shadow-md transition flex items-center gap-1.5";
      lucide.createIcons();

      // Configuração de timer
      if (mode === 'timer') {
        timeRemaining = 15 * 60;
        timerLabel.innerText = "Tempo Restante";
        timerDisplay.innerText = formatTime(timeRemaining);
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
          timeRemaining--;
          timerDisplay.innerText = formatTime(timeRemaining);
          if (timeRemaining <= 0) {
            endGame(false, "Tempo Esgotado!");
          }
        }, 1000);
      } else {
        timeRemaining = 0;
        timerLabel.innerText = "Tempo Decorrido";
        timerDisplay.innerText = formatTime(timeRemaining);
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
          timeRemaining++;
          timerDisplay.innerText = formatTime(timeRemaining);
        }, 1000);
      }
    }

    // ENCERRAR JOGO / DESISTÊNCIA
    function endGame(victory = false, reason = "Viagem Finalizada") {
      isPlaying = false;
      clearInterval(timerInterval);
      countryInput.disabled = true;
      countryInput.value = '';
      countryInput.placeholder = 'Jogo finalizado!';
      
      gameActionBtn.innerHTML = `<i data-lucide="play" class="w-4 h-4 fill-white"></i> <span>Novo Jogo</span>`;
      gameActionBtn.className = "px-4 py-2 rounded-lg font-bold text-sm bg-emerald-600 hover:bg-emerald-500 text-white shadow-md transition flex items-center gap-1.5";
      lucide.createIcons();

      // Revelar países que faltaram em vermelho
      COUNTRIES_DB.forEach((c, idx) => {
        const card = document.getElementById(`card-${idx}`);
        if (!guessedCountries.has(idx)) {
          card.classList.remove('bg-slate-800/40', 'border-slate-800');
          card.classList.add('bg-rose-950/40', 'border-rose-800/60');
          card.querySelector('.country-name').innerText = c.name;
          card.querySelector('.country-name').classList.remove('text-slate-500');
          card.querySelector('.country-name').classList.add('text-rose-400');
        }
      });

      // Abrir modal de pontuação
      modalTitle.innerText = victory ? "Parabéns, Você Deu a Volta ao Mundo!" : reason;
      modalSubtitle.innerText = victory ? "Você acertou todos os 196 países da Terra!" : "Veja como foi sua performance global nesta partida:";
      modalScore.innerText = guessedCountries.size;
      modalPercent.innerText = `${Math.round((guessedCountries.size / 196) * 100)}%`;
      gameOverModal.classList.remove('hidden');
    }

    // VALIDAÇÃO EM TEMPO REAL
    countryInput.addEventListener('input', (e) => {
      if (!isPlaying) return;
      const rawVal = e.target.value;
      const val = normalize(rawVal);
      if (!val) return;

      let foundIndex = -1;

      for (let i = 0; i < COUNTRIES_DB.length; i++) {
        const country = COUNTRIES_DB[i];
        const matchMain = normalize(country.name) === val;
        const matchSyn = country.syn.some(s => normalize(s) === val);

        if (matchMain || matchSyn) {
          foundIndex = i;
          break;
        }
      }

      if (foundIndex !== -1) {
        if (guessedCountries.has(foundIndex)) {
          // Já adivinhado
          typingFeedback.innerText = 'Já digitado!';
          typingFeedback.className = 'absolute right-4 text-xs font-bold px-2 py-1 rounded bg-amber-500/20 text-amber-400 border border-amber-500/30';
          playSound('duplicate');
        } else {
          // Novo acerto
          guessedCountries.add(foundIndex);
          const country = COUNTRIES_DB[foundIndex];
          const card = document.getElementById(`card-${foundIndex}`);
          
          card.classList.remove('bg-slate-800/40', 'border-slate-800');
          card.classList.add('bg-emerald-950/40', 'border-emerald-600/60', 'animate-success-pop');
          card.querySelector('.country-name').innerText = country.name;
          card.querySelector('.country-name').classList.remove('text-slate-500');
          card.querySelector('.country-name').classList.add('text-emerald-300', 'font-bold');

          lastGuessedDisplay.innerText = country.name;
          countryInput.value = '';
          typingFeedback.innerText = '+1 Acerto!';
          typingFeedback.className = 'absolute right-4 text-xs font-bold px-2 py-1 rounded bg-emerald-500/20 text-emerald-400 border border-emerald-500/30';
          playSound('hit');
          updateCounters();

          if (guessedCountries.size === 196) {
            endGame(true, "Você Venceu!");
          }
        }
      }
    });

    // TROCA DE MODO (15M / LIVRE)
    modeTimerBtn.addEventListener('click', () => {
      if (isPlaying) return;
      mode = 'timer';
      modeTimerBtn.className = "px-2.5 py-1.5 rounded-md font-semibold text-white bg-brand-600 transition";
      modeFreeBtn.className = "px-2.5 py-1.5 rounded-md font-semibold text-slate-400 hover:text-white transition";
      timerLabel.innerText = "Tempo";
      timerDisplay.innerText = "15:00";
    });

    modeFreeBtn.addEventListener('click', () => {
      if (isPlaying) return;
      mode = 'free';
      modeFreeBtn.className = "px-2.5 py-1.5 rounded-md font-semibold text-white bg-brand-600 transition";
      modeTimerBtn.className = "px-2.5 py-1.5 rounded-md font-semibold text-slate-400 hover:text-white transition";
      timerLabel.innerText = "Tempo";
      timerDisplay.innerText = "00:00";
    });

    // BOTÃO DE ÁUDIO
    toggleAudioBtn.addEventListener('click', () => {
      isMuted = !isMuted;
      audioIcon.setAttribute('data-lucide', isMuted ? 'volume-x' : 'volume-2');
      toggleAudioBtn.classList.toggle('text-rose-400', isMuted);
      lucide.createIcons();
    });

    // BOTÃO COMEÇAR / DESISTIR
    gameActionBtn.addEventListener('click', () => {
      if (!isPlaying) {
        startGame();
      } else {
        if (confirm("Tem certeza de que deseja encerrar a viagem e ver as respostas restantes?")) {
          endGame(false, "Desistência");
        }
      }
    });

    // FILTRO DE ABAS POR CONTINENTE
    continentTabs.forEach(tab => {
      tab.addEventListener('click', () => {
        continentTabs.forEach(t => {
          t.classList.remove('bg-brand-600', 'text-white');
          t.classList.add('bg-slate-800', 'text-slate-300');
        });
        tab.classList.add('bg-brand-600', 'text-white');
        tab.classList.remove('bg-slate-800', 'text-slate-300');

        const continent = tab.dataset.continent;
        activeFilter = continent;

        COUNTRIES_DB.forEach((c, idx) => {
          const card = document.getElementById(`card-${idx}`);
          if (continent === 'all' || c.continent === continent) {
            card.style.display = 'flex';
          } else {
            card.style.display = 'none';
          }
        });
      });
    });

    // BOTÕES DO MODAL
    modalReviewBtn.addEventListener('click', () => {
      gameOverModal.classList.add('hidden');
    });

    modalRestartBtn.addEventListener('click', () => {
      gameOverModal.classList.add('hidden');
      startGame();
    });

    // INICIALIZAÇÃO
    window.addEventListener('DOMContentLoaded', () => {
      renderGrid();
      lucide.createIcons();
    });
